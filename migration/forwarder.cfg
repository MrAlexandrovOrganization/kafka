global
  maxconn 256
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h
  retries 3

listen kafka
  bind :9092
  server destination 100.64.0.3:9092 check inter 10s fall 3 rise 2

listen redis
  bind :6379
  server destination 100.64.0.6:16379 check inter 10s fall 3 rise 2

listen location
  bind :8080
  server destination 100.64.0.6:18084 check inter 10s fall 3 rise 2

listen otlp-grpc
  bind :4317
  server destination 100.64.0.3:4317 check inter 10s fall 3 rise 2

listen otlp-http
  bind :4318
  server destination 100.64.0.3:4318 check inter 10s fall 3 rise 2

listen query
  bind :16686
  server destination 100.64.0.3:16686 check inter 10s fall 3 rise 2
